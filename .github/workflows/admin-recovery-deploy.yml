name: Admin Recovery Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-admin-recovery'
  workflow_dispatch:

jobs:
  deploy-admin:
    name: Recover Admin Northflank service
    runs-on: ubuntu-latest

    steps:
      - name: Validate Northflank secrets
        shell: bash
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
          NORTHFLANK_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$NORTHFLANK_API_TOKEN" ] || missing+=(NORTHFLANK_API_TOKEN)
          [ -n "$NORTHFLANK_PROJECT_ID" ] || missing+=(NORTHFLANK_PROJECT_ID)
          [ -n "$NORTHFLANK_SERVICE_ID" ] || missing+=(NORTHFLANK_ADMIN_SERVICE_ID)

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required Northflank secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Trigger Admin Northflank build from main
        shell: bash
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}
          NORTHFLANK_SERVICE_ID: ${{ secrets.NORTHFLANK_ADMIN_SERVICE_ID }}
        run: |
          set -euo pipefail
          echo "Triggering Northflank admin build for main"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"branch":"main"}' \
            "https://api.northflank.com/v1/projects/${NORTHFLANK_PROJECT_ID}/services/${NORTHFLANK_SERVICE_ID}/build"
